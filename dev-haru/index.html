<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="スノーボードのスタンスと滑走メモをブラッシュアップする専用作業版" />
  <title>スタンスメモ（はる作業版）</title>
  <link rel="stylesheet" href="style.css?v=1005">
</head>
<body data-menu-side="left">

<header class="topbar">
  <div class="title-wrap">
    <h1 class="title">スタンスメモ <span class="haru-badge">はる作業版</span></h1>
  </div>

  <button id="menuBtn" class="menu-btn" type="button" aria-label="メニュー" aria-expanded="false">
    ☰
  </button>
</header>


<nav class="view-tabs" role="tablist" aria-label="画面">
  <button id="inputTab" type="button" role="tab" data-view="input" aria-controls="inputView" aria-selected="true">入力</button>
  <button id="historyTab" type="button" role="tab" data-view="history" aria-controls="historyView" aria-selected="false" tabindex="-1">保存履歴 <span id="savedCount" class="count-badge">0</span></button>
</nav>

<main>
<section id="inputView" role="tabpanel" aria-labelledby="inputTab">
<section class="card setup-card" aria-label="セッティング入力">

  <div class="setup-meta">
    <label>板名<input id="board" type="text" placeholder="例：TNT"></label>

    <label>雪質
      <select id="snow">
        <option value="">選択</option>
        <option value="パウダー">パウダー</option>
        <option value="圧雪">圧雪</option>
        <option value="春雪">春雪</option>
        <option value="アイス">アイス</option>
      </select>
    </label>
    
  </div>

    <div class="stance-quick" aria-label="スタンス">
    <span class="stance-label">スタンス</span>
    <button type="button" data-stance="duck">ダック</button>
    <button type="button" data-stance="forward">前振り</button>
    <button type="button" data-stance="back">後振り</button>
  </div>

  <div class="foot-tabs" role="tablist" aria-label="設定する足">
    <button id="leftFootTab" type="button" role="tab" data-foot="left" aria-controls="leftFootPanel" aria-selected="true">左足<span class="foot-summary" data-summary="left">角度未入力 · 穴0</span></button>
    <button id="rightFootTab" type="button" role="tab" data-foot="right" aria-controls="rightFootPanel" aria-selected="false" tabindex="-1">右足<span class="foot-summary" data-summary="right">角度未入力 · 穴0</span></button>
  </div>

<div class="bindings">
  <section id="leftFootPanel" class="binding-panel" role="tabpanel" aria-labelledby="leftFootTab">
    
    <div class="side-row">
  <label class="angle">
    左足の角度（°）
    <input id="left-angle" type="number" placeholder="+15">
  </label>

  <div class="disk">
    <div class="disk-label">ディスク</div>
    <div class="disk-group" data-side="left">
      <button type="button" class="chip" data-value="前">前</button>
      <button type="button" class="chip" data-value="中">中</button>
      <button type="button" class="chip" data-value="後">後</button>
    </div>
  </div>
</div>
    <p class="binding-help">↑ ノーズ側 · 穴をタップして選択</p>
    <div class="holes" data-side="left">
      <div class="row">
        <button type="button" class="hole"></button><button type="button" class="hole"></button><button type="button" class="hole"></button>
        <button type="button" class="hole"></button><button type="button" class="hole"></button><button type="button" class="hole"></button>
      </div>

    <div class="ref-wrap" data-side="left">
     <div class="ref-help" data-side="left">タップして推奨位置追加</div>
       <div class="ref-line" data-side="left"></div>
     </div>
      
      <div class="row">
        <button type="button" class="hole"></button><button type="button" class="hole"></button><button type="button" class="hole"></button>
        <button type="button" class="hole"></button><button type="button" class="hole"></button><button type="button" class="hole"></button>
      </div>
    </div>
  </section>

  <section id="rightFootPanel" class="binding-panel" role="tabpanel" aria-labelledby="rightFootTab" hidden>
    <div class="side-row">
      <label class="angle">右足の角度（°）<input id="right-angle" type="number" placeholder="-9"></label>
      <div class="disk">
        <div class="disk-label">ディスク</div>
        <div class="disk-group" data-side="right">
          <button type="button" class="chip" data-value="前">前</button>
          <button type="button" class="chip" data-value="中">中</button>
          <button type="button" class="chip" data-value="後">後</button>
        </div>
      </div>
    </div>
    <p class="binding-help">↑ ノーズ側 · 穴をタップして選択</p>
    <div class="holes" data-side="right">
      <div class="row">
        <button type="button" class="hole"></button><button type="button" class="hole"></button><button type="button" class="hole"></button>
        <button type="button" class="hole"></button><button type="button" class="hole"></button><button type="button" class="hole"></button>
      </div>

    <div class="ref-wrap" data-side="right">
     <div class="ref-help" data-side="right">タップして推奨位置追加</div>
       <div class="ref-line" data-side="right"></div>
     </div>
      
      <div class="row">
        <button type="button" class="hole"></button><button type="button" class="hole"></button><button type="button" class="hole"></button>
        <button type="button" class="hole"></button><button type="button" class="hole"></button><button type="button" class="hole"></button>
      </div>
    </div>
  </section>
</div>

  <details id="commentDetails" class="comment-details">
    <summary>コメント <span id="commentState">任意</span></summary>
    <label class="comment-label" for="comment">滑った感覚・気づいたこと</label>
    <textarea id="comment" rows="2" placeholder="例：カービングしやすい / 右足が疲れる"></textarea>
    <button id="commentClearBtn" type="button" class="comment-clear">コメントを消す</button>
  </details>

  <div class="editor-actions">
    <button id="clearBtn" type="button">クリア</button>
    <button id="saveBtn" type="button">この設定を保存</button>
  </div>
</section>
</section>

<section id="historyView" role="tabpanel" aria-labelledby="historyTab" hidden>
<section class="history-heading">
  <div>
    <h2>保存履歴</h2>
    <p>板ごとの設定を読み返したり、お気に入りを上に並べたりできます。</p>
  </div>
  <span class="history-hint">★ お気に入り</span>
</section>

<div class="tabs-bar">
  <!-- 1段目 左：板タブ -->
  <div id="boardTabs" class="tabs"></div>
  </div>
  
<div id="history"></div>
</section>
</main>
  
<div id="menuSwipeEdge" class="menu-swipe-edge" aria-hidden="true"></div>

  <!-- 設定した側から出るメニュー -->
<div id="menuOverlay" class="menu-overlay" hidden></div>

<aside id="menuPanel" class="menu-panel" aria-label="設定とデータ管理" aria-hidden="true" inert>
  <div class="menu-head">
    <div class="menu-title">⚙ 設定 / データ管理</div>
    <button id="menuCloseBtn" class="menu-close" type="button" aria-label="閉じる">×</button>
  </div>

  <div class="menu-body">

  <section class="menu-card" id="menuFilters">
    <h3>🎛 フィルター / ソート</h3>
    <div id="filtersMountMenu"></div>
  </section>

  <section class="menu-card">
    <h3>📦 データ管理</h3>

      <button id="btnExport" type="button" class="menu-action">📤 バックアップを書き出す（.json）</button>

      <div class="import-box">
        <div class="import-title">📥 バックアップから復元</div>

        <input id="importFile" type="file" accept="application/json" class="import-file">

        <div id="importPreview" class="import-preview">
          <div class="import-muted">※ ここにプレビューが出るよ</div>
        </div>

        <div class="import-actions">
          <button id="btnImportMerge" type="button" class="menu-action" disabled>追加して復元（安全）</button>
          <button id="btnImportReplace" type="button" class="menu-action danger" disabled>上書きで復元（危険）</button>
        </div>

        <div id="importError" class="import-error" hidden></div>
      </div>
    </section>

    <section class="menu-card">
    <h3>🎛 表示・操作</h3>
      <label class="menu-position-label" for="menuSide">メニューの位置</label>
      <select id="menuSide" class="menu-side-select">
        <option value="left">左側</option>
        <option value="right">右側</option>
      </select>
      <p id="menuGestureHelp" class="menu-note">左端から右へスワイプで開きます。</p>
    </section>

    <section class="menu-card dev-footer" id="devFooter">
      <h3>🧪 はる作業版</h3>
      <div class="dev-actions">
        <button id="btnDevCopyProd" type="button" class="dev-btn">本番データを取り込む</button>
        <button id="btnDevReset" type="button" class="dev-btn danger">作業版データ全削除</button>
      </div>
      <p class="dev-note">※本番のデータは消えず、作業版にコピーされます。</p>
    </section>
  </div>
</aside> 
  
  <div id="filtersPanel" class="menu-filters" hidden>
    <!-- ① 日付ソート -->
    <label class="menu-label">
      並び替え
      <select id="sortMode" class="sort-select">
        <option value="savedDesc">保存日↓</option>
        <option value="savedAsc">保存日↑</option>
        <option value="boardAsc">板名</option>
        <option value="snowAsc">雪質</option>
      </select>
    </label>

    <!-- ② スタンス -->
    <div class="menu-label">
      スタンス
      <div class="stance-tabs" id="stanceTabs"></div>
    </div>

    <!-- ③ 角度 -->
    <div class="menu-label">
      角度
      <div class="angle-filter" aria-label="角度検索">
        <input id="angleLeft" class="angle-in" type="number" placeholder="L">
        <input id="angleRight" class="angle-in" type="number" placeholder="R">
        <span class="angle-pm">±</span>
        <input id="angleTol" class="angle-tol" type="number" value="2" min="0">
        <button id="angleClear" class="angle-clear" type="button">×</button>
      </div>
    </div>

    <!-- ✅ オールクリア -->
    <button id="btnFilterClear" type="button" class="menu-action">
      🧹 フィルター/ソートを全部クリア
    </button>
  </div>

<script src="script.js?v=1005"></script>

<div id="toast"></div>
  
  
</body>
</html>
